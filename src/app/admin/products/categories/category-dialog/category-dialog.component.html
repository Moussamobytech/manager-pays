<h1 mat-dialog-title>{{ isUpdateMode ? 'Modifier la catégorie' : 'Ajouter une catégorie' }}</h1>

<!-- Affichage du message de succès -->


<!-- Formulaire -->
<form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
    <div mat-dialog-content>
        <div fxLayout="row wrap">
            <!-- Champ caché pour l'ID de la catégorie -->
            <input type="hidden" formControlName="id">

            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Nom</mat-label>
                <input matInput formControlName="nom" required>
                <mat-error *ngIf="form.get('nom').hasError('required')">Nom est obligatoire</mat-error>
            </mat-form-field>
            <mat-dialog-content *ngIf="showSuccessMessage" class="form-container">
              <p>{{ isUpdateMode ? 'Catégorie modifiée avec succès' : 'Catégorie ajoutée avec succès' }}</p>
          </mat-dialog-content>
            <div class="py-1">
                <mat-label>Image</mat-label>
                <input type="file" formControlName="image" (change)="onFileSelected($event)" accept="image/*">
                <mat-error *ngIf="form.get('image').hasError('required')">Image est obligatoire</mat-error>
            </div>
        </div>
    </div>

    <div mat-dialog-actions>
        <div fxLayout="row" fxLayoutAlign="space-between center" class="w-100">
            <button mat-raised-button color="warn" type="button" (click)="dialogRef.close()">Close</button>
            <button mat-raised-button color="primary" type="submit">{{ isUpdateMode ? 'Modifier' : 'Ajouter' }}</button>
        </div>
    </div>
</form>
