<mat-card class="p-0">
    <div class="mat-mdc-table admin-table header-sm truncated">
        <div class="mat-mdc-header-row">
            <div class="mat-mdc-header-cell">{{ 'PRODUCTS.CREATED' | translate }}</div>
            <div class="mat-mdc-header-cell">{{ 'PRODUCTS.STATE' | translate }}</div>
            <div class="mat-mdc-header-cell">{{ 'PRODUCTS.PRICE' | translate }}</div>
            <div class="mat-mdc-header-cell">{{ 'PRODUCTS.LIBELLE' | translate }}</div>
            <div class="mat-mdc-header-cell"></div>
        </div>
        <div *ngFor="let order of orders" class="mat-mdc-row">
            <div class="mat-mdc-cell">{{order.createdDate | date}}</div>
            <div class="mat-mdc-cell">{{order.etat}}</div>
            <div class="mat-mdc-cell">{{order.priceBasic}}</div>     
            <div class="mat-mdc-cell"><span class="order">{{order.nom}}</span></div>
            <div class="mat-mdc-cell">
                <div class="p-2 actions">          
                    <button mat-mini-fab color="primary" matTooltip="View">
                        <mat-icon>remove_red_eye</mat-icon>
                    </button>
                    <!-- <button *ngIf="order.invoice" mat-mini-fab color="warn" matTooltip="View invoice" class="btn-invoice">
                        <mat-icon>receipt</mat-icon>
                    </button> -->
                </div>
            </div>      
        </div>
    </div>
</mat-card>
