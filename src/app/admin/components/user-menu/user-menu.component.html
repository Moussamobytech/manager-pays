<button mat-icon-button [matMenuTriggerFor]="userMenu" #userMenuTrigger="matMenuTrigger" >
    <mat-icon>account_circle</mat-icon>
</button>

<mat-menu #userMenu="matMenu" [overlapTrigger]="false" class="toolbar-dropdown-menu user-menu">
    <span (mouseleave)="userMenuTrigger.closeMenu()">
        <mat-toolbar color="primary">
            <div fxLayout="row" fxLayoutAlign="space-around center" class="user-info">
                <img [src]="userImage" alt="user-image" width="80" class="mat-elevation-z6">
                <p>{{currentUser?.firstname}} {{currentUser?.lastname}}<br> <small *ngFor="let profile of currentUser?.profiles" >{{profile.name| userType }}</small></p>

            </div>
        </mat-toolbar>
        <!-- <a mat-menu-item routerLink="/admin">
            <mat-icon>person</mat-icon>
            <span>Profile</span>
        </a> -->
        <a mat-menu-item routerLink="/admin/information">
            <mat-icon>edit</mat-icon>
            <span>{{"ACCOUNT" | translate}}</span>
        </a>
        <a mat-menu-item routerLink="/admin/information/update">
          <mat-icon>password</mat-icon>
          <span>{{"ADMIN_NAV.PASSWORD" | translate}}</span>
        </a>
        <!-- <a mat-menu-item routerLink="/admin">
            <mat-icon>settings</mat-icon>
            <span>Settings</span>
        </a>
        <a mat-menu-item routerLink="/admin">
            <mat-icon>lock</mat-icon>
            <span>Lock screen</span>
        </a>
        <a mat-menu-item routerLink="/admin">
            <mat-icon>help</mat-icon>
            <span>Help</span>
        </a> -->
        <div class="divider"></div>
        <!-- <button mat-icon-button (click)="logout()">
            <mat-icon>power_settings_new</mat-icon>
            <span>{{"LOGOUT" | translate}}</span>
        </button> -->
        <a mat-menu-item (click)="logout()">
            <mat-icon>power_settings_new</mat-icon>
            <span>{{"LOGOUT" | translate}}</span>
        </a>
    </span>
</mat-menu>
