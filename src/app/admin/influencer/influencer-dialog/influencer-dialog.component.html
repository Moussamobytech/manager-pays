<h1 mat-dialog-title class="text-center">{{ isUpdateMode ? 'Modifier influencer' : 'Ajouter influencer' }}</h1>

<!-- Affichage du message de succès -->


<!-- Formulaire -->
<form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
  <div mat-dialog-content>
    <div fxLayout="row wrap">
      <!-- Champ caché pour l'ID du influencer -->
      <input type="hidden" formControlName="id">

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nom complet</mat-label>
        <input matInput formControlName="nomComplet" required>
        <mat-error *ngIf="form.get('nomComplet').hasError('required')">Nom complet est obligatoire</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Code</mat-label>
        <input matInput formControlName="code" required>
        <mat-error *ngIf="form.get('code').hasError('required')">Code est obligatoire</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" required>
        <mat-error *ngIf="form.get('email').hasError('required')">Email est obligatoire</mat-error>
      </mat-form-field>
      


      <mat-dialog-content *ngIf="showSuccessMessage" class="form-container">
        <p>{{ isUpdateMode ? 'Influencer modifié avec succès' : 'Influencer ajoutée avec succès' }}</p>
      </mat-dialog-content>


      <!-- <div class="py-1">
        <mat-label>Logo</mat-label>
        <input type="file" formControlName="logo" (change)="onFileSelected($event)" accept="logo/*">
        <mat-error *ngIf="form.get('logo').hasError('required')">Logo est obligatoire</mat-error>
      </div> -->
    </div>
    <!-- <img *ngIf="isUpdateMode" src="{{data.influencer.logo}}" alt="" srcset="" class="image"> -->
  </div>

  <div mat-dialog-actions>
    <div fxLayout="row" fxLayoutAlign="space-between center" class="w-100">
      <button mat-raised-button color="warn" type="button" (click)="dialogRef.close()">Close</button>
      <button mat-raised-button color="primary" type="submit">{{ isUpdateMode ? 'Modifier' : 'Ajouter' }}</button>
    </div>
  </div>
</form>
