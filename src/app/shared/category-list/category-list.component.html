<div *ngFor="let category of categorie">
    <button mat-menu-item (click)="changeCategory($event)">
        <span>{{category.nom}}</span>
    </button>
     <div *ngIf="category" class="sub-category">
        <app-category-list [categories]="tous" [categoryParentId]="category.id" (change)="changeCategory($event)"></app-category-list>
    </div>
</div>
