
<div *ngFor="let category of categories">
  <button mat-menu-item (click)="changeCategory(category.cle || category.id)">
      <span>{{category.nom}}</span>
  </button>
   <div *ngIf="category" class="sub-category">
      <app-category-list [categories]="categorie" [categoryParentId]="category.id" (change)="changeCategory($event)"></app-category-list>
  </div>
</div>
