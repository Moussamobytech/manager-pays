<div fxLayout="row" fxLayout.xs="column" [fxLayoutAlign]="align" class="text-muted">
    <div *ngIf="product?.quantite > 0 && (type=='all' || type=='wish')">
        <bdi fxLayout="row" fxLayoutAlign="start center">
            <span *ngIf="type!='wish'" class="fw-500">Quantity:</span>
            <button mat-icon-button matTooltip="Remove" (click)="decrement()"><mat-icon>remove</mat-icon></button>
            <span> {{count}} </span>
            <button mat-icon-button matTooltip="Add" (click)="increment()"><mat-icon>add</mat-icon></button>
        </bdi>
    </div>
    <div class="product-contact d-flex flex-nowrap overflow-auto">
        <button matTooltip="Add to cart" *ngIf="pageName !='cart'"  mat-raised-button class="rose mr-2" matTooltip="Add to cart" (click)="addToCart(product)">
             Ajouter <mat-icon>shopping_cart</mat-icon>
        </button>
        <a *ngIf="pageName !='cart'" [href]="'tel:' + '+223'+product?.contact " class="light_primary-color text-sm"
        [ngStyle]="{'display': styleConditions
        ? 'block' : 'inline', 'margin-top': styleConditions ? '10px' : '0'}">
            <i class="fas fa-phone-volume fa-lg me-2"></i>
        </a>
    </div>
</div>
