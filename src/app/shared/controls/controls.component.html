<div fxLayout="row" fxLayout.xs="column" [fxLayoutAlign]="align" class="text-muted">
    <div *ngIf="product?.availibilityCount > 0 && (type=='all' || type=='wish')">
        <bdi fxLayout="row" fxLayoutAlign="start center">
            <span *ngIf="type!='wish'" class="fw-500">Quantity:</span>
            <button mat-icon-button matTooltip="Remove" (click)="decrement()"><mat-icon>remove</mat-icon></button>
            <span> {{count}} </span>
            <button mat-icon-button matTooltip="Add" (click)="increment()"><mat-icon>add</mat-icon></button>
        </bdi>
    </div>
    <div *ngIf="type!='wish'" class="product-contact d-flex flex-nowrap overflow-auto">
      <a [href]="'tel:' + product?.contact + '?body=Bonjour, je suis intéressé par le produit ' + product?.nom + '. Prix : ' + product?.prix" class="primary-color text-sm">
          <i class="fas fa-phone-volume fa-lg me-2"></i>
      </a>
      <a *ngIf="product?.contact" href="https://wa.me/{{product?.contact}}" target="_blank" class="ml-2 text-sm" style="color:#25D366;">
          <i class="fab fa-whatsapp fa-lg me-2"></i>
      </a>
      <a [href]="'sms:' + product?.contact + '?body=Bonjour, je suis intéressé par le produit ' + product?.nom + '. Prix : ' + product?.prix" class="warn-color ml-2 text-sm">
          <i class="fas fa-sms fa-lg me-2"></i>
      </a>
    </div>

</div>
