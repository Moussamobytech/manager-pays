<div  class="text-muted">
  <div class="product-contact d-flex flex-nowrap overflow-auto">
      <button mat-raised-button class="buy-btn" matTooltip="Acheter" (click)="openWA(product)">
          <mat-icon>shopping_cart</mat-icon> Acheter
      </button>
      <a [href]="'tel:' + '+223'+product?.contact " class="light_primary-color text-sm"
      [ngStyle]="{'display': styleConditions
      ? 'block' : 'inline', 'margin-top': styleConditions ? '10px' : '0'}">
          <i class="fas fa-phone-volume fa-lg me-2"></i>
      </a>
  </div>
</div>
