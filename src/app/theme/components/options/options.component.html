<div class="options transition" [ngClass]="{'show': showOptions}">
    <button mat-raised-button (click)="showOptions = !showOptions" class="options-icon mat-elevation-z0 p-0">
        <mat-icon class="mat-icon-md m-0">palette</mat-icon>
    </button>
    <mat-card fxLayout="column" fxLayoutAlign="space-between center">
        <span class="skin-icon fidelity" title="Fidelity" (click)="changeTheme('fidelity')"></span>
        <span class="skin-icon purple" title="Purple" (click)="changeTheme('purple')"></span>
        <span class="skin-icon green" title="Green" (click)="changeTheme('green')"></span>
        <span class="skin-icon blue" title="Blue" (click)="changeTheme('blue')"></span>
        <span class="skin-icon red" title="Red" (click)="changeTheme('red')"></span>
        <span class="skin-icon pink" title="Pink" (click)="changeTheme('pink')"></span>
        <span class="skin-icon grey" title="Grey" (click)="changeTheme('grey')"></span>
        <button mat-mini-fab color="warn" (click)="settings.rtl = !settings.rtl" matTooltip="LTR / RTL">
            <mat-icon>swap_horiz</mat-icon>
        </button>
    </mat-card>
</div>
