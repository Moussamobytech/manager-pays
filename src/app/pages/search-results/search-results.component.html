<p>Résultats de recherche</p>

<div class="grid-list" *ngIf="products.length > 0; else noResults">
  <div fxLayout="row wrap">
    <div *ngFor="let product of products" fxFlex="100" fxFlex.md="20" fxFlex.gt-md="20">
      <div class="p-2">
        <app-product-card [product]="product"></app-product-card>
      </div>
    </div>
  </div>
</div>
<ng-template #noResults>
  <p>Aucun produit trouvé.</p>
</ng-template>
