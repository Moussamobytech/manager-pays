<p>Résultats de recherche</p>

<div class="grid-list" *ngIf="products.length > 0; else noResults">
  <div fxLayout="row wrap">
    <div *ngFor="let product of products" fxFlex="100" fxFlex.md="20" fxFlex.gt-md="20">
      <div class="p-2">
        <app-product-card [product]="product"></app-product-card>
      </div>
    </div>
  </div>
</div>
<ng-template #noResults>
  <div class="not-found-container">
    <div class="icon-wrapper">
      <i class="fas fa-binoculars"></i>
    </div>
    <h2>Aucun résultat pour votre recherche.</h2>
    <ul>
      <li><span>Vérifiez l’orthographe de votre recherche</span></li>
      <li><span>Essayez d’autres mots-clés ou synonymes</span></li>
      <li><span>Utilisez une recherche plus générale puis filtrez les résultats</span></li>
    </ul>
    <a class="home-btn" href="/">
      <i class="fas fa-home"></i> Retour à l’accueil
    </a>
  </div>
</ng-template>
