<app-main-carousel [slides]="slides"></app-main-carousel>

<div fxLayout="row wrap" class="info-bar">
    <div fxFlex="100" fxFlex.gt-md="25" fxFlex.gt-xs="50">
        <mat-card class="light-block p-3" fxLayout="row"  fxLayoutAlign="start center">
            <mat-icon class="mat-icon-xlg text-muted m-0">card_giftcard</mat-icon>
            <div class="content">
                <p>BONUS PLUS</p>
                <span class="text-muted m-0">Make fun of shopping and collect bonuses</span>
            </div>
        </mat-card>
    </div>
    <div fxFlex="100" fxFlex.gt-md="25" fxFlex.gt-xs="50">
        <mat-card class="light-block p-3" fxLayout="row"  fxLayoutAlign="start center">
            <mat-icon class="mat-icon-xlg text-muted m-0">expédition_locale</mat-icon>
            <div class="content">
                <p>FREE </p>
                <span class="text-muted m-0">Free shipping on all orders over $99</span>
            </div>
        </mat-card>
    </div>
    <div fxFlex="100" fxFlex.gt-md="25" fxFlex.gt-xs="50">
        <mat-card class="light-block p-3" fxLayout="row"  fxLayoutAlign="start center">
            <mat-icon class="mat-icon-xlg text-muted m-0">monetization_on</mat-icon>
            <div class="content">
                <p>MONEY BACK GUARANTEE</p>
                <span class="text-muted m-0">30 Days money return guarantee</span>
            </div>
        </mat-card>
    </div>
    <div fxFlex="100" fxFlex.gt-md="25" fxFlex.gt-xs="50">
        <mat-card class="light-block p-3" fxLayout="row"  fxLayoutAlign="start center">
            <mat-icon class="mat-icon-xlg text-muted m-0">history</mat-icon>
            <div class="content">
                <p>ONLINE SUPPORT 24/7</p>
                <span class="text-muted m-0">Call us: (+100) 123 456 7890</span>
            </div>
        </mat-card>
    </div>
</div>

<app-banners [banners]="banners"></app-banners>

<div class="products-tabs">

    <mat-tab-group mat-stretch-tabs (selectedTabChange)="onLinkClick($event)">


      <mat-tab label="All Products">
        <app-products-carousel [products]="produit"></app-products-carousel>
       </mat-tab>

       <mat-tab *ngFor="let items of categories" label="{{ items.nom }}">
        <app-products-carousel [idCat]="items.id"></app-products-carousel>
    </mat-tab>



    </mat-tab-group>

</div>

<app-brands-carousel [brands]="brands"></app-brands-carousel>
