<div class="sign-in-container">
  <div class="main-title">
    <img src="assets/images/logo_fidelity.png" alt="Fidelity Logo" class="logo" />
    <h3>Se connecter</h3>
    <div class="divider"></div>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onLoginFormSubmit(loginForm.value)">

    <div class="phone-group" fxLayout="row">
      <mat-form-field appearance="outline" class="country-select" fxFlex="33.6">
        <mat-label>Pays</mat-label>
        <mat-select formControlName="country" (selectionChange)="handleChange($event)">
          <mat-select-trigger>
            <ng-container *ngIf="selectedCountry">
              {{ selectedCountry.indicatif }}
              <img class="country-icon" [src]="'assets/icons/countries/' + selectedCountry.nom + '.png'" alt="">
            </ng-container>
          </mat-select-trigger>
          <mat-option *ngFor="let country of countries" [value]="country.id">
            {{ country.indicatif }} <img class="country-icon" src="assets/icons/countries/{{country.nom}}.png" alt="">
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="phone-number" fxFlex="63.6">
        <mat-label>Téléphone</mat-label>
        <input matInput formControlName="username" [placeholder]="selectedCountry?.mask" [mask]="selectedCountry?.mask" />
        <mat-error *ngIf="loginFormControls.username.errors?.required">Identifiant est obligatoire</mat-error>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Mot de passe</mat-label>
      <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'" required>
      <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Toggle password visibility'" [attr.aria-pressed]="hidePassword">
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="loginFormControls?.password.errors?.required"> Mot de passe est obligatoire </mat-error>
      <mat-error *ngIf="loginFormControls?.password.errors?.minlength"> Mot de passe n'est pas assez long, minimum 6 caractères </mat-error>
    </mat-form-field>

    <a class="forgot-password" routerLink="#">Mot de passe oublié</a>

    <div class="buttons">
      <button mat-button type="button" class="back-btn" routerLink="/authentication">
        <mat-icon>arrow_back</mat-icon> Retour
      </button>

      <button mat-flat-button type="submit" class="vld-btn" [disabled]="!loginForm.valid">
        Valider <mat-icon>arrow_forward</mat-icon>
      </button>
    </div>

  </form>
</div>
