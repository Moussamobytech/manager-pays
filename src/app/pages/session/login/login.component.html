<!-- login.component.html -->

<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-6">
      <mat-card>
        <mat-card-header>
          <mat-card-title>Login</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <form [formGroup]="loginForm" (ngSubmit)="login(loginForm.value)">

            <mat-form-field class="full-width">
              <input matInput placeholder="Username" name="username" formControlName="username" required>
              <mat-error *ngIf="loginFormControl.username.hasError('required')">
                Le nom d'utilisateur est <strong>obligatoire</strong>
              </mat-error>
            </mat-form-field>

            <mat-form-field class="full-width">
              <input matInput placeholder="Mot de passe" [type]="hide ? 'password' : 'text'"
              formControlName="password" required>
              <mat-icon matSuffix (click)="hide = !hide">{{hide ? 'visibility_off' :
                'visibility'}}</mat-icon>
              <mat-error *ngIf="loginFormControl.password.hasError('required')">
                Le mot de passe est <strong>obligatoire</strong>
              </mat-error>
            </mat-form-field>

            <button mat-raised-button [disabled]="loading" color="primary" type="submit" class="full-width">Se Connecter</button>

            <div style="margin: 20px auto;">
              <p class="mb-10" style="font-family: 'Century Gothic', Arial, sans-serif;font-weight: bold;">Vous
                n'avez pas de compte ?
                <a [routerLink]="['/authentication/register']" class="mat-text-primary">S'inscrire</a>
              </p>
            </div>

          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
