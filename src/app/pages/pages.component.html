    <mat-toolbar color="primary" id="header-toolbar">
        <mat-toolbar-row fxLayoutAlign="space-between center" class="top-toolbar bg-primary">
            <span fxHide="false" fxHide.gt-sm>
                <button mat-button (click)="sidenav.toggle()" class="sidenav-toggle">
                    <mat-icon class="mat-icon-md mr-0">menu</mat-icon>
                </button>
            </span>
            <span fxShow="false" fxShow.gt-xs fxLayoutAlign="center center"><mat-icon>call</mat-icon>  Fixe: (+223) 76 00 79 79 </span>
            <!-- <span fxShow="false" fxShow.gt-sm>{{ 'WELCOME' | translate }}</span> -->
            <app-top-menu></app-top-menu>
        </mat-toolbar-row>
        <mat-toolbar-row fxLayoutAlign="space-between center" class="logo-toolbar bg-primary">

            <div fxFlex="20">
                <a class="logo" routerLink="/" (click)="closeSubMenus()">
                  <img src="./assets/images/logo_fidelity.png" alt="logo_fidelity">
                  <span>&nbsp;&nbsp;Fidelity</span>
                </a>
            </div>
            <div fxFlex fxShow="false" fxShow.gt-sm>
                <form method="get" class="search-form" fxLayout="row">
                    <button mat-raised-button [matMenuTriggerFor]="categoriesMenu" #categoriesMenuTrigger="matMenuTrigger" type="button" class="mat-elevation-z0 categories text-truncate  ">{{category?.nom}}<mat-icon iconPositionEnd>arrow_drop_down</mat-icon></button>
                    <mat-menu #categoriesMenu="matMenu" [overlapTrigger]="false" xPosition="before" class="categories-dropdown">
                        <span (mouseleave)="categoriesMenuTrigger.closeMenu()">
                            <app-category-list [categories]="categories" [categoryParentId]="0" (change)="changeCategory($event)"></app-category-list>
                        </span>
                    </mat-menu>
                    <input type="text" [placeholder]="'BTN.SEARCH' | translate" fxFlex>
                    <button mat-mini-fab (click)="search()" type="button" class="search-btn mat-elevation-z0 text-muted">
                        <mat-icon>search</mat-icon>
                    </button>
                </form>
            </div>
