<mat-sidenav-container class="pages-container">
  <mat-sidenav [opened]="false" mode="over" #sidenav class="sidenav mat-elevation-z6">

          <mat-icon color="warn">close</mat-icon>
      </button>
      <div class="divider"></div>
      <app-sidenav-menu *ngIf="sidenavMenuItems" [menuItems]="sidenavMenuItems" [menuParentId]="null"></app-sidenav-menu>
      <div class="divider"></div>
      <div class="text-center py-2">

              </svg>
          </a>

              </svg>
          </a>
          <a href="https://fidely.io/">
              <svg class="social-icon" viewBox="0 0 24 24">
                  <path d="M5,3H19A2,2 0 0,1 21,5V19A2,2 0 0,1 19,21H5A2,2 0 0,1 3,19V5A2,2 0 0,1 5,3M19.5,12H18V10.5H17V12H15.5V13H17V14.5H18V13H19.5V12M9.65,11.36V12.9H12.22C12.09,13.54 11.45,14.83 9.65,14.83C8.11,14.83 6.89,13.54 6.89,12C6.89,10.46 8.11,9.17 9.65,9.17C10.55,9.17 11.13,9.56 11.45,9.88L12.67,8.72C11.9,7.95 10.87,7.5 9.65,7.5C7.14,7.5 5.15,9.5 5.15,12C5.15,14.5 7.14,16.5 9.65,16.5C12.22,16.5 13.96,14.7 13.96,12.13C13.96,11.81 13.96,11.61 13.89,11.36H9.65Z" />

      </div>
  </mat-sidenav>

  <mat-toolbar color="primary" id="header-toolbar">
      <mat-toolbar-row fxLayoutAlign="space-between center" class="top-toolbar bg-primary">
          <span fxHide="false" fxHide.gt-sm>
              <button mat-button (click)="sidenav.toggle()" class="sidenav-toggle">
                  <mat-icon class="mat-icon-md mr-0">menu</mat-icon>
              </button>
          </span>
          <span fxShow="false" fxShow.gt-xs fxLayoutAlign="center center"><mat-icon>call</mat-icon> Fixe: (+223) 76 00 79 79 </span>
          <app-top-menu></app-top-menu>
      </mat-toolbar-row>
      <mat-toolbar-row fxLayoutAlign="space-between center" class="logo-toolbar bg-primary">
          <div fxFlex="20">
              <a class="logo" routerLink="/" (click)="closeSubMenus()">
                  <img src="./assets/images/logo_fidelity.png" alt="logo_fidelity">
                  <span  fxShow.xs="false">&nbsp;&nbsp;Fidelity</span>
              </a>
          </div>
          <div fxFlex fxShow="false" fxShow.gt-sm>

              <form (submit)="onSearch($event)" class="search-form" fxLayout="row">
                <button mat-raised-button [matMenuTriggerFor]="categoriesMenu" #categoriesMenuTrigger="matMenuTrigger" type="button" class="mat-elevation-z0 categories text-truncate">{{ category?.nom }}<mat-icon iconPositionEnd>arrow_drop_down</mat-icon></button>
                <mat-menu #categoriesMenu="matMenu" [overlapTrigger]="false" xPosition="before" class="categories-dropdown">
                    <span (mouseleave)="categoriesMenuTrigger.closeMenu()" >
                        <app-category-list [categories]="categories" [categoryParentId]="0" (change)="changeCategory($event)"></app-category-list>
                    </span>
                </mat-menu>
                <input type="text" [formControl]="searchTerm" placeholder="Rechercher un produit" name="query" fxFlex>
                <button mat-mini-fab type="submit"  class="search-btn mat-elevation-z0 text-muted">
                  <mat-icon>search</mat-icon>
              </button>
              </form>
              <div *ngIf="showSuggestions && suggestions.length > 0" 
                    class="suggestions-list" 
                    appClickOutside="onClickOutside()" 
                    #suggestionsContainer>
                <ul>
                <li *ngFor="let suggestion of suggestions" (click)="selectSuggestion(suggestion)">
                    {{ suggestion.nom }}
                </li>
                </ul>
             	</div>

          </div>
          <div  fxFlex="20" fxFlex fxShow="false" fxShow.xs="true"  fxShow.gt-md="false" fxShow.gt-sm="false">
              
              <form (submit)="onSearch($event)" class="search-form" fxLayout="row">
                <!-- [formControl]="searchTerm" -->
                <input type="text" [formControl]="searchTerm" placeholder="Rechercher un produit" name="query" fxFlex>
                <button mat-mini-fab type="submit"  class="search-btn mat-elevation-z0 text-muted">

              </button>

							<div *ngIf="showSuggestions && suggestions.length > 0"

								</li>
								</ul>
							</div>
          </div>

        <div class="scrollmenu" fxShow.gt-md="false" fxShow.gt-sm="false">
            <!-- <a href="#home">Home</a>
            <a href="#news">News</a> -->
            
            <a [routerLink]="['/products', 'mode']">Mode-Beauté</a>
            <a [routerLink]="['/products', 'health']">Santé-Bien-être</a>
            <a [routerLink]="['/products', 'household']">Electroménagers</a>
            <a [routerLink]="['/products', 'multimedia']">Multimédia</a>

            <a [routerLink]="['/products', 'auto']">Auto-Moto</a>

  <app-menu fxShow="false" fxShow.gt-sm></app-menu>

  <div class="theme-container main">
      <app-breadcrumb fxShow fxHide.xs></app-breadcrumb>
      <router-outlet></router-outlet>
  </div>

  <!-- <app-options></app-options> -->
  <app-footer></app-footer>
  <div *ngIf="showBackToTop" fxLayout="row" fxLayoutAlign="center center" class="back-to-top transition" (click)="scrollToTop()">
