   À partir de votre tableau de bord, vous avez la possibilité de voir un aperçu de votre activité, de mettre à jour les informations de votre compte. Sélectionnez un lien ci-dessous pour afficher ou modifier les informations.</p> -->

<div fxLayout="row wrap">

  <div fxFlex="100" fxFlex.xl="33.3" fxFlex.lg="33.3" fxFlex.md="50" fxFlex.sm="100" class="p-2">
    <mat-card class="gradient-purple tile p-2">
      <mat-icon>shopping_cart</mat-icon>
      <h2>{{statsNumber.total}}</h2>
      <p>Produits </p>
  </mat-card>  </div>
  <div fxFlex="100" fxFlex.xl="33.3" fxFlex.lg="33.3" fxFlex.md="50" fxFlex.sm="100" class="p-2 ">
    <mat-card class="bleu tile p-2 ">
      <mat-icon>check_circle</mat-icon>
      <h2>{{statsNumber.actif}}</h2>
      <p>Annonces</p>
  </mat-card>  </div>
  <div fxFlex="100" fxFlex.xl="33.3" fxFlex.lg="33.3" fxFlex.md="50" fxFlex.sm="100" class="p-2">
    <mat-card class="rose tile p-2">
      <mat-icon>cancel</mat-icon>
      <h2>{{statsNumber.inactif}}</h2>
      <p>Produits non publies</p>
  </mat-card>  </div>
</div>
<div fxLayout="row wrap">
  <div fxFlex="100" fxFlex.xl="50" fxFlex.lg="50" fxFlex.md="100" fxFlex.sm="100" class="p-2">
    <mat-card class="jaune tile p-2">
      <mat-icon>pending</mat-icon>
      <h2>{{statsNumber.pending}}</h2>
      <p>Produits en attente de validation</p>
  </mat-card>
</div>
  <div fxFlex="100" fxFlex.xl="50" fxFlex.lg="50" fxFlex.md="100" fxFlex.sm="100" class="p-2">
    <mat-card class="gradient-green tile p-2">
      <mat-icon>score</mat-icon>
      <h2>{{statsNumber.points || '0'}}</h2>
      <p>Nombre de points</p>
  </mat-card>
</div>

</div>
