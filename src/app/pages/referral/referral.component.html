<div class="referal-container">
  <!-- <h1 class="main-title">Programme de parrainage</h1> -->

  <div class="referal-header">
    <div class="gift-icon">🎁</div>
    <div class="referal-details">
      <h2>GAGNE JUSQU’À 5000 F PAR AMI INVITÉ !</h2>
      <p>Invite tes amis et gagne de l’argent à chaque transaction qu’ils réalisent ! 🚀</p>
      <div class="referal-link" fxLayout.lt-sm="column">
        <div fxFlex.xs="50" fxLayout="row" class="copy-container">
          <input matInput type="text" value="fidelity.promo" class="copy-input" #linkInput readonly>
          <mat-icon (click)="copyLink(linkInput)" *ngIf="!isCopied">content_copy</mat-icon>
          <mat-icon matSuffix *ngIf="isCopied">check</mat-icon>
        </div>
        <div class="share-icons">
          <i class="fa-brands fa-whatsapp wa-icon"></i>
          <mat-icon class="ph-icon" >share</mat-icon>
        </div>
      </div>
    </div>
  </div>


  <div class="referal-benefits" fxLayout="row wrap" fxLayoutGap="15px" fxLayoutAlign="start center">
    <div class="benefit" fxFlex="45" fxFlex.gt-xs="30" fxFlex.gt-sm="22" *ngFor="let benefit of benefits" >
      <div class="icon">
        <i [class]="benefit.iconClass"></i>
      </div>
      <h3>{{ benefit.title }}</h3>
      <p>{{ benefit.description }}</p>
    </div>
  </div>

  <div class="testimonials-container">
    <referal-testimonials></referal-testimonials>
  </div>
</div>
